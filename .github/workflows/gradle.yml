
name: Build LAYDZR CLIENT

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build LAYDZR CLIENT
        working-directory: laydzr-client
        run: gradle build --no-daemon

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: LAYDZR-CLIENT-BUILD
          path: laydzr-client/build/libs/*.jar
          if-no-files-found: error
